    <!--
      SPA fallback decoder — pairs with 404.html.
      When a customer opens a deep link like /onesource/companies directly,
      GitHub Pages serves 404.html which rewrites the URL to /onesource/?/companies.
      This script decodes that back to /onesource/companies without a reload so
      React Router resumes normally. Source: rafgraph/spa-github-pages (MIT).
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
