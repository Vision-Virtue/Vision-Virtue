<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>One Source</title>
<script>
  // SPA fallback for GitHub Pages — encodes deep path as ?/<path>,
  // then /onesource/index.html decodes it back. Source: rafgraph/spa-github-pages (MIT).
  (function () {
    var pathSegmentsToKeep = 1;   // '/onesource/' = 1 segment
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  })();
</script>
</head>
<body></body>
</html>
