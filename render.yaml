services:
  - type: web
    name: vv-marketing-api
    runtime: node
    rootDir: marketing-backend
    # libreoffice-impress is required by the marketplace deck viewer to
    # auto-convert the populated investor-deck PPTX into a view-only PDF for
    # investors who have signed the NDA. Adding the meta package + java
    # headless dependency covers the standard PPTX → PDF path.
    buildCommand: npm install && npm run build
    startCommand: npm start
    aptPackages:
      - libreoffice
      - libreoffice-impress
      - default-jre-headless
    disk:
      name: vv-marketing-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: FRONTEND_URL
        value: https://visionvirtuepartnership.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RAPHAEL_PASSCODE
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /data/marketing.db
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        value: https://vv-marketing-api.onrender.com/api/auth/linkedin/callback
      - key: LINKEDIN_ORGANIZATION_ID
        sync: false
      - key: LINKEDIN_PERSON_URN
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false

  # ── Podcast (V&V Video Editor) ──────────────────────────────────────────────
  # Containerised Flask app + ffmpeg + mediapipe. Requires the `video-editor-gui`
  # folder to live inside this repo (move it next to `marketing-backend/`).
  # The 10 GB disk holds uploads/, broll/, exports/, models/, backgrounds/.
  - type: web
    name: vv-podcast
    runtime: docker
    rootDir: video-editor-gui
    dockerfilePath: Dockerfile
    plan: standard          # 2 GB RAM — required by Whisper + MediaPipe
    healthCheckPath: /__health
    disk:
      name: vv-podcast-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: VV_ACCESS_CODE
        sync: false         # set in Render dashboard — same code as Marketing-API
      - key: SECRET_KEY
        generateValue: true
      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg
      - key: PYTHONUNBUFFERED
        value: "1"
