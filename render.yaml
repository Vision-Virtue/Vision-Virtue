services:
  - type: web
    name: vv-marketing-api
    runtime: node
    rootDir: marketing-backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://visionvirtuepartnership.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RAPHAEL_PASSCODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: ./data/marketing.db
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        value: https://vv-marketing-api.onrender.com/api/auth/linkedin/callback
      - key: LINKEDIN_ORGANIZATION_ID
        sync: false
