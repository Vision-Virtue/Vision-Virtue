services:
  - type: web
    name: vv-marketing-api
    runtime: node
    rootDir: marketing-backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        value: https://vision-virtue.github.io
      - key: ANTHROPIC_API_KEY
        sync: false          # you will paste this in the Render dashboard
      - key: RAPHAEL_PASSCODE
        sync: false          # set your desired passcode in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: DB_PATH
        value: /opt/render/project/data/marketing.db
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        value: https://vv-marketing-api.onrender.com/api/auth/linkedin/callback
      - key: LINKEDIN_ORGANIZATION_ID
        sync: false
    disk:
      name: vv-db
      mountPath: /opt/render/project/data
      sizeGB: 1
